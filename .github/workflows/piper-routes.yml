name: Piper and Unified Route Regression

on:
  pull_request:
    branches: [new-main]
    paths:
      - "kira/local_voice.py"
      - "kira/voice.py"
      - "kira/routes.py"
      - "kira/ui/main_window_provider_settings.py"
      - "tests/test_local_voice_auto_setup.py"
      - "tests/test_routes.py"
      - ".github/workflows/piper-routes.yml"
  push:
    branches: [feature/auto-piper-unified-model-routes]
    paths:
      - "kira/local_voice.py"
      - "kira/voice.py"
      - "kira/routes.py"
      - "kira/ui/main_window_provider_settings.py"
      - "tests/test_local_voice_auto_setup.py"
      - "tests/test_routes.py"
      - ".github/workflows/piper-routes.yml"

permissions:
  contents: read

jobs:
  focused-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install portable test dependency
        run: python -m pip install requests
      - name: Compile touched modules and tests
        run: >-
          python -m py_compile
          kira/local_voice.py
          kira/voice.py
          kira/routes.py
          kira/ui/main_window_provider_settings.py
          tests/test_local_voice_auto_setup.py
          tests/test_routes.py
      - name: Test automatic Piper preparation and grouped Route behavior
        run: >-
          python -m unittest
          tests.test_local_voice_auto_setup
          tests.test_routes.RouteModelTests
          -v
