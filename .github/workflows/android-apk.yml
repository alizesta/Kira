name: Android APK

on:
  push:
    branches: [feature/android-ai-assistant, feature/shared-skills-connectors-v1]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install required Android SDK packages
        run: |
          set -euxo pipefail
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          PLATFORM_DIR="$SDK_ROOT/platforms"
          test -f "$PLATFORM_DIR/android-37.0/android.jar"
          # SDK Manager publishes API 37 as android-37.0, while AGP 9.5
          # resolves compileSdk 37 using the android-37 hash directory.
          if [ ! -e "$PLATFORM_DIR/android-37" ]; then
            ln -s android-37.0 "$PLATFORM_DIR/android-37"
          fi
          test -f "$PLATFORM_DIR/android-37/android.jar"

      - name: Run JVM unit tests
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest 2>&1 | tee ../android-unit-tests.log

      - name: Build APK
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee ../android-apk-build.log

      - name: Upload Android build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kira-Android-build-logs
          path: |
            android-unit-tests.log
            android-apk-build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kira-Android-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
