name: Build Kira Update

on:
  push:
    branches: [main, new-main, "next/2026-11-11-intelligence", "feature/characters-ren-mika", "fix/desktop-attachments-project-icons"]
    paths:
      - ".github/workflows/kira-release.yml"
      - "kira/**"
      - "assets/characters/**"
      - "install.bat"
      - "tests/test_game_audio.py"
      - "tests/test_game_mode.py"
      - "tests/test_game_detection.py"
      - "tests/test_native_function_calling.py"
      - "tests/test_storage.py"
      - "kira/game_mode_policy.py"
      - "tests/test_game_mode_policy.py"
      - "tests/test_streaming.py"
      - "tests/test_chat_persistence.py"
      - "tests/test_chat_events.py"
      - "tests/test_chat_commands.py"
      - "tests/test_chat_command_adapters.py"
      - "tests/test_chat_application_service.py"
      - "tests/test_gui_routes.py"
      - "tests/test_gui_offscreen.py"
      - "tests/test_release.py"
      - "tests/test_release_package.py"
      - "tests/test_vision_pipeline.py"
      - "tests/test_news_feed.py"
      - "tests/test_news_sources.py"
      - "tests/test_news_post_generator.py"
      - "scripts/release-allowlist.json"
      - "tests/test_actions.py"
      - "tests/test_vision_routing.py"
      - "tests/test_characters.py"
      - "requirements.txt"
      - ".gitattributes"
      - "*.bat"
      - "tests/test_code_agent.py"
      - "tests/test_chat_code.py"
      - "tests/test_auto_agent.py"
      - "tests/test_chat_code_gui.py"
      - "tests/test_chat_render.py"
      - "tests/test_body.py"
      - "tests/test_build_metadata.py"
      - "scripts/build_metadata.py"
      - "kira/code_agent.py"
      - "kira/tools/agent.py"
      - "kira/tools/registry.py"
      - "docs/**"
      - "tests/test_api_manager.py"
      - "tests/test_attachments.py"
      - "tests/test_routes.py"
      - "tests/test_router_routes.py"
      - "tests/test_ollama.py"
      - "tests/test_route_editor_widget.py"
      - "tests/test_providers.py"
      - "tests/test_persona_memory.py"
      - "tests/test_app_resolution.py"
      - "tests/test_architecture_boundaries.py"
      - "tests/test_application_policy_wiring.py"
      - "tests/test_service_module.py"
      - "tests/test_tool_agent_session_isolation.py"
      - "tests/test_session_application.py"
      - "tests/test_provider_application.py"
      - "tests/test_vision_application.py"
      - "tests/test_coding_agent_application.py"
      - "tests/test_runtime_settings_application.py"
      - "tests/test_character_profile_service.py"
      - "tests/test_voice_application.py"
      - "tests/test_mood_service.py"
      - "tests/test_web_search_application.py"
      - "tests/test_persian_quality.py"
      - "scripts/build_release.py"
      - ".github/workflows/kira-release.yml"
      - "PROJECT_CONTEXT.md"
      - "ARCHITECTURE.md"
      - "CHANGELOG.md"
      - "TASK_HANDOFF.md"
  pull_request:
    types: [opened, synchronize, reopened]

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kira-update-release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  windows-full-suite:
    # Draft PRs run the portable suite first; TASK 007 keeps its focused Qt-free checks.
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name != 'pull_request' || github.head_ref != 'refactor/chat-session-lifecycle' && github.head_ref != 'refactor/chat-commands-actions') }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Windows test dependencies
        run: python -m pip install PySide6 requests numpy
      - name: Run character news regressions on Windows
        run: python -m unittest tests.test_news_feed tests.test_news_sources tests.test_news_post_generator tests.test_release_package
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Check character news Python syntax on Windows
        run: python -m py_compile kira/news_feed.py kira/news_sources.py kira/news_post_generator.py kira/ui/main_window_voice_settings.py kira/ui/pages/news_feed_panel.py
      - name: Run the complete Windows test suite
        run: python -m unittest discover -s tests -t . -v
        env:
          QT_QPA_PLATFORM: offscreen

  portable-regression:
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name != 'pull_request' || github.head_ref != 'refactor/chat-session-lifecycle') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install portable test dependency
        run: python -m pip install requests
      - name: Validate version and build metadata
        run: python scripts/build_metadata.py --check
      - name: Run news feed regression tests
        run: python -m unittest tests.test_news_feed tests.test_news_sources tests.test_news_post_generator tests.test_release_package
      - name: Check character news Python syntax
        run: python -m py_compile kira/news_feed.py kira/news_sources.py kira/news_post_generator.py kira/ui/main_window_voice_settings.py kira/ui/pages/news_feed_panel.py
      - name: Run portable regression tests
        run: >-
          python -m unittest
          tests.test_api_manager
          tests.test_attachments
          tests.test_routes
          tests.test_router_routes
          tests.test_ollama
          tests.test_providers
          tests.test_persona_memory
          tests.test_characters
          tests.test_avatar_art
          tests.test_app_resolution
          tests.test_architecture_boundaries
          tests.test_application_module_lifecycle
          tests.test_composition_root_contract
          tests.test_domain_organization
          tests.test_domain_search
          tests.test_domain_transfer
          tests.test_domain_chat_contracts
          tests.test_domain_conversation_rules
          tests.test_application_service_ports
          tests.test_feature_module_registration
          tests.test_chat_history_service_capabilities
          tests.test_session_application
          tests.test_provider_application
          tests.test_vision_application
          tests.test_coding_agent_application
          tests.test_runtime_settings_application
          tests.test_character_profile_service
          tests.test_voice_application
          tests.test_mood_service
          tests.test_application_policy_wiring
          tests.test_service_module
          tests.test_tool_agent_session_isolation
          tests.test_fast_commands
          tests.test_web_search_application
          tests.test_persian_quality
          tests.test_release_package
          tests.test_game_mode_policy
          tests.test_code_agent
          tests.test_chat_code
          tests.test_auto_agent
          tests.test_native_function_calling
          tests.test_storage
          tests.test_game_detection
          tests.test_streaming
          tests.test_chat_persistence
          tests.test_chat_persistence_contract
          tests.test_chat_search
          tests.test_chat_transfer
          tests.test_chat_conversation_lifecycle
          tests.test_chat_organization
          tests.test_chat_coordinator
          tests.test_chat_context_builder
          tests.test_chat_application_service
          tests.test_chat_attachments
          tests.test_chat_attachment_controller
          tests.test_chat_commands
          tests.test_chat_command_adapters
          tests.test_chat_events
          tests.test_chat_application_wiring
          tests.test_chat_session_manager
          tests.test_chat_render
          tests.test_chat_response_handler
          tests.test_body
          tests.test_build_metadata
          tests.test_release
          tests.test_actions
          tests.test_vision_pipeline
          tests.test_news_feed
          tests.test_news_sources
          tests.test_news_post_generator
      - name: Check Python syntax
        run: python -m compileall -q kira scripts tests

  package-and-release:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/new-main' || github.ref == 'refs/heads/next/2026-11-11-intelligence' || github.ref == 'refs/heads/feature/characters-ren-mika'
    needs: [windows-full-suite, portable-regression]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install portable test dependency
        run: python -m pip install requests

      - name: Validate version and build metadata
        run: python scripts/build_metadata.py --check

      - name: Run portable regression tests (GUI and Windows tests excluded)
        run: >-
          python -m unittest
          tests.test_api_manager
          tests.test_attachments
          tests.test_routes
          tests.test_router_routes
          tests.test_ollama
          tests.test_providers
          tests.test_persona_memory
          tests.test_characters
          tests.test_avatar_art
          tests.test_app_resolution
          tests.test_architecture_boundaries
          tests.test_application_module_lifecycle
          tests.test_composition_root_contract
          tests.test_domain_organization
          tests.test_domain_search
          tests.test_domain_transfer
          tests.test_domain_chat_contracts
          tests.test_session_application
          tests.test_provider_application
          tests.test_vision_application
          tests.test_coding_agent_application
          tests.test_runtime_settings_application
          tests.test_character_profile_service
          tests.test_voice_application
          tests.test_mood_service
          tests.test_application_policy_wiring
          tests.test_service_module
          tests.test_tool_agent_session_isolation
          tests.test_web_search_application
          tests.test_persian_quality
          tests.test_release_package
          tests.test_game_mode_policy
          tests.test_code_agent
          tests.test_chat_code
          tests.test_auto_agent
          tests.test_native_function_calling
          tests.test_storage
          tests.test_game_detection
          tests.test_streaming
          tests.test_chat_persistence
          tests.test_chat_attachments
          tests.test_chat_commands
          tests.test_chat_command_adapters
          tests.test_chat_render
          tests.test_body
          tests.test_build_metadata
          tests.test_release

      - name: Check Python syntax
        run: python -m compileall -q kira scripts tests

      - name: Build timestamped source ZIP
        id: package
        run: python scripts/build_release.py

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          target_commitish: ${{ github.sha }}
          tag_name: v1.2
          name: Kira 1.2
          body: |
            Kira 1.2 — Eye Mode and unified desktop awareness.

            This release consolidates periodic selected-monitor observation, privacy-checked capture, bounded RAM-only DesktopContext, freshness-aware current/historical screen context, optional local OCR and Gemini Live visual sampling (maximum 1 FPS). This is sampled screen input, not continuous 30/60 FPS video. Raw screen frames are not persisted and ordinary chat receives text context rather than automatic screenshots.

            The source archive uses the ProjectKira_YYMMDD_HHMM.zip format and Asia/Tehran local time. Version/build metadata is validated and stamped during packaging; Settings → General → About displays version, Gregorian build date, 24-hour build time and the detected developer. Windows batch files are normalized to CRLF in the release ZIP.

            The release workflow runs the configured Windows and portable regression suites plus Python syntax validation before packaging. Passing those jobs does not replace manual Windows acceptance of multi-monitor capture, OCR quality, CPU/latency, Qt interaction and Gemini Live API compatibility. These runtime checks remain explicitly unverified until exercised on a Windows machine with a compatible Live model.

            Eye Mode must be manually enabled. Disabling the mode/source or denying privacy stops capture and clears pending visual state. Game Mode OCR remains off by default. The archive contains source only; user settings, API keys and local databases are excluded.
          files: ${{ steps.package.outputs.asset }}
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
