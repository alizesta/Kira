name: Build Kira Update

on:
  push:
    branches: [main, "next/2026-11-11-intelligence", "feature/characters-ren-mika"]
    paths:
      - "kira/**"
      - "assets/characters/**"
      - "install.bat"
      - "tests/test_game_audio.py"
      - "tests/test_game_mode.py"
      - "tests/test_game_detection.py"
      - "kira/game_mode_policy.py"
      - "tests/test_game_mode_policy.py"
      - "tests/test_streaming.py"
      - "tests/test_chat_persistence.py"
      - "tests/test_gui_routes.py"
      - "tests/test_gui_offscreen.py"
      - "tests/test_release.py"
      - "tests/test_release_package.py"
      - "tests/test_characters.py"
      - "requirements.txt"
      - ".gitattributes"
      - "*.bat"
      - "tests/test_code_agent.py"
      - "kira/code_agent.py"
      - "kira/code_workspace.py"
      - "kira/tools/agent.py"
      - "kira/tools/registry.py"
      - "docs/**"
      - "tests/test_api_manager.py"
      - "tests/test_routes.py"
      - "tests/test_router_routes.py"
      - "tests/test_providers.py"
      - "tests/test_persona_memory.py"
      - "tests/test_app_resolution.py"
      - "tests/test_persian_quality.py"
      - "scripts/build_release.py"
      - ".github/workflows/kira-release.yml"
      - "PROJECT_CONTEXT.md"
      - "ARCHITECTURE.md"
      - "CHANGELOG.md"
      - "TASK_HANDOFF.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kira-update-release
  cancel-in-progress: false

jobs:
  windows-game-mode:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Windows test dependencies
        run: python -m pip install PySide6 requests
      - name: Run Game Mode identity and monitor regression tests
        run: python -m unittest tests.test_game_detection tests.test_game_mode
        env:
          QT_QPA_PLATFORM: offscreen

  package-and-release:
    needs: windows-game-mode
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install portable test dependency
        run: python -m pip install requests

      - name: Run portable regression tests (GUI and Windows tests excluded)
        run: >-
          python -m unittest
          tests.test_api_manager
          tests.test_routes
          tests.test_router_routes
          tests.test_providers
          tests.test_persona_memory
          tests.test_characters
          tests.test_app_resolution
          tests.test_persian_quality
          tests.test_release_package
          tests.test_minimax_cloud_voice
          tests.test_game_mode_policy
          tests.test_code_agent
          tests.test_native_function_calling
          tests.test_game_detection
          tests.test_streaming
          tests.test_chat_persistence
          tests.test_release

      - name: Check Python syntax
        run: python -m compileall -q kira scripts tests

      - name: Build timestamped source ZIP
        id: package
        run: python scripts/build_release.py

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          target_commitish: ${{ github.sha }}
          tag_name: kira-${{ steps.package.outputs.stamp }}-${{ github.run_number }}
          name: Kira Update ${{ steps.package.outputs.stamp }}
          body: |
            Kira source update.

            The source archive uses the ProjectKira_YYMMDD_HHMM.zip format and Asia/Tehran local time.

            Portable regression tests and Python syntax checks passed before packaging. A separate Windows runner validates Game Mode identity and monitor regressions with Qt offscreen; other GUI and full interactive Windows runtime checks remain manual. Windows batch files are normalized to CRLF in the release ZIP.
            Game Mode has manual Story and Competitive Safe profiles. Competitive Safe disables game capture, game/system loopback and local control tools; Story Mode keeps local-only WASAPI speech recognition. Ai1 Code adds an independent Code Agent, single-file Diff preview and explicit patch approval; shell commands require explicit user confirmation. Kira, Mika and Ren have separate coding, medical-information and news-analysis specialties with generated character portraits.
          files: ${{ steps.package.outputs.asset }}
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
