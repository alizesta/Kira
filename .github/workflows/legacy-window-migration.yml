name: Legacy Window Migration Tests

on:
  pull_request:
    branches: [new-main]
    paths:
      - "kira/oldmain.py"
      - "kira/app/session_relay.py"
      - "kira/app/session_controller.py"
      - "tests/test_session_relay.py"
      - "tests/test_session_window_controller.py"
      - ".github/workflows/legacy-window-migration.yml"
  push:
    branches: [new-main]
    paths:
      - "kira/oldmain.py"
      - "kira/app/session_relay.py"
      - "tests/test_session_relay.py"
      - ".github/workflows/legacy-window-migration.yml"

permissions:
  contents: read

jobs:
  session-adapter-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime for adapter tests
        run: python -m pip install --upgrade pip PySide6
      - name: Run session adapter tests
        run: python -m unittest tests.test_session_relay tests.test_session_window_controller -v
      - name: Compile migrated modules
        run: python -m py_compile kira/oldmain.py kira/app/session_relay.py kira/app/session_controller.py tests/test_session_relay.py tests/test_session_window_controller.py
