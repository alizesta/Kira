name: APInex Provider Regression

on:
  pull_request:
    branches: [new-main]
    paths:
      - "tests/test_api_manager.py"
      - "tests/test_providers.py"
      - "kira/local_voice.py"
      - "kira/voice.py"
      - "kira/routes.py"
      - "kira/ui/main_window_provider_settings.py"
      - "tests/test_local_voice_auto_setup.py"
      - "tests/test_routes.py"
      - ".github/workflows/apinex-provider.yml"
  push:
    branches: [test/apinex-provider-integration]
    paths:
      - "tests/test_api_manager.py"
      - "tests/test_providers.py"
      - ".github/workflows/apinex-provider.yml"

permissions:
  contents: read

jobs:
  apinex-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install portable test dependency
        run: python -m pip install requests
      - name: Compile provider modules and focused tests
        run: >-
          python -m py_compile
          kira/api_manager.py
          kira/discovery.py
          kira/settings_schema.py
          kira/hybrid_ai.py
          kira/hybrid_providers.py
          tests/test_api_manager.py
          tests/test_providers.py
      - name: Test APInex key detection, model discovery, registration and chat transport
        run: >-
          python -m unittest
          tests.test_api_manager.DetectionTests.test_apinex_key_discovers_catalog_and_registers_chat_provider
          tests.test_providers.ProviderTests.test_apinex_provider_uses_openai_chat_completions_and_preserves_model_id
          -v
  piper-and-unified-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install portable test dependency
        run: python -m pip install requests
      - name: Compile changed speech and routing modules
        run: >-
          python -m py_compile
          kira/local_voice.py
          kira/voice.py
          kira/routes.py
          kira/ui/main_window_provider_settings.py
          tests/test_local_voice_auto_setup.py
          tests/test_routes.py
      - name: Run Piper auto-setup and grouped Route regressions
        run: >-
          python -m unittest
          tests.test_local_voice_auto_setup
          tests.test_routes
          -v
