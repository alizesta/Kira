name: Initiative Quality Tests

on:
  push:
    branches: [new-main]
    paths:
      - "kira/character/initiative.py"
      - "kira/app/initiative_application.py"
      - "kira/app/initiative_composition.py"
      - "kira/app/feature_modules.py"
      - "kira/app/brain_application.py"
      - "kira/app/reflection_application.py"
      - "kira/core/interfaces/brain.py"
      - "kira/core/interfaces/mood_service.py"
      - "kira/services/mood_service.py"
      - "kira/services/memory_service.py"
      - "kira/ui/window_presentation_context.py"
      - "kira/ui/feature_controller_registry.py"
      - "kira/ui/window_feature_controller.py"
      - "kira/ui/components/composer_owner.py"
      - "kira/ui/components/code_chat_host.py"
      - "tests/test_feature_controller_registry.py"
      - "kira/ui/main_window_composition.py"
      - "kira/ui/bootstrap.py"
      - "tests/test_initiative_application.py"
      - "tests/test_mood_service.py"
      - "tests/test_feature_module_registration.py"
      - "tests/test_composition_root_contract.py"
      - "tests/test_brain_reflection_ownership.py"
      - "kira/chat/persistence.py"
      - "kira/chat/application_service.py"
      - "kira/core/interfaces/chat_history_service.py"
      - "kira/services/chat_history_service.py"
      - "kira/services/character_service.py"
      - "kira/emotion/runtime.py"
      - "kira/mood.py"
      - "kira/persona_memory.py"
      - "kira/config.py"
      - "kira/strings.py"
      - "kira/ui/main_window_session_support.py"
      - "kira/ui/main_window_session.py"
      - "kira/ui/main_window_character_settings.py"
      - "kira/ui/pages/characters_page.py"
      - "tests/test_initiative_quality.py"
      - "tests/test_character_decision.py"
      - "tests/test_character_profile_service.py"
      - "docs/INITIATIVE_ENGINE_FA.md"
      - ".github/workflows/initiative-quality.yml"
  pull_request:
    branches: [new-main]
    paths:
      - "kira/character/initiative.py"
      - "kira/app/initiative_application.py"
      - "kira/app/initiative_composition.py"
      - "kira/app/feature_modules.py"
      - "kira/core/interfaces/mood_service.py"
      - "kira/services/mood_service.py"
      - "kira/services/memory_service.py"
      - "kira/ui/window_presentation_context.py"
      - "kira/ui/main_window_composition.py"
      - "kira/ui/bootstrap.py"
      - "tests/test_initiative_application.py"
      - "tests/test_mood_service.py"
      - "tests/test_feature_module_registration.py"
      - "tests/test_composition_root_contract.py"
      - "kira/chat/persistence.py"
      - "kira/chat/application_service.py"
      - "kira/core/interfaces/chat_history_service.py"
      - "kira/services/chat_history_service.py"
      - "kira/services/character_service.py"
      - "kira/emotion/runtime.py"
      - "kira/mood.py"
      - "kira/persona_memory.py"
      - "kira/config.py"
      - "kira/strings.py"
      - "kira/ui/main_window_session_support.py"
      - "kira/ui/main_window_session.py"
      - "kira/ui/main_window_character_settings.py"
      - "kira/ui/pages/characters_page.py"
      - "tests/test_initiative_quality.py"
      - "tests/test_character_decision.py"
      - "tests/test_character_profile_service.py"
      - "docs/INITIATIVE_ENGINE_FA.md"
      - ".github/workflows/initiative-quality.yml"

permissions:
  contents: read

jobs:
  initiative-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run initiative policy and character decision tests
        run: >-
          python -m unittest
          tests.test_initiative_quality
          tests.test_initiative_application
          tests.test_mood_service
          tests.test_character_decision
          tests.test_character_profile_service
          tests.test_feature_module_registration
          tests.test_composition_root_contract
          tests.test_brain_reflection_ownership
          tests.test_feature_controller_registry
          -v
      - name: Compile changed Python modules
        run: >-
          python -m py_compile
          kira/character/initiative.py
          kira/app/initiative_application.py
          kira/app/initiative_composition.py
          kira/app/feature_modules.py
          kira/app/brain_application.py
          kira/app/reflection_application.py
          kira/core/interfaces/brain.py
          tests/test_brain_reflection_ownership.py
          kira/core/interfaces/mood_service.py
          kira/services/mood_service.py
          kira/services/memory_service.py
          kira/ui/window_presentation_context.py
          kira/ui/feature_controller_registry.py
          kira/ui/window_feature_controller.py
          kira/ui/components/composer_owner.py
          kira/ui/components/code_chat_host.py
          tests/test_feature_controller_registry.py
          kira/ui/main_window_composition.py
          kira/ui/bootstrap.py
          tests/test_initiative_application.py
          tests/test_mood_service.py
          tests/test_feature_module_registration.py
          tests/test_composition_root_contract.py
          kira/chat/persistence.py
          kira/chat/application_service.py
          kira/core/interfaces/chat_history_service.py
          kira/services/chat_history_service.py
          kira/services/character_service.py
          kira/config.py
          kira/strings.py
          kira/ui/main_window_session.py
          kira/ui/main_window_session_support.py
          kira/ui/main_window_character_settings.py
          kira/ui/pages/characters_page.py
          tests/test_initiative_quality.py
          tests/test_character_decision.py
          tests/test_character_profile_service.py
