name: VRM Avatar Backend Checks

on:
  push:
    branches: [feature/vrm-avatar-support]
    paths:
      - "kira/vrm/**"
      - "kira/face.py"
      - "kira/main.py"
      - "kira/characters/registry.py"
      - "kira/characters/kira.py"
      - "kira/vrm/paths.py"
      - "kira sample.vrm"
      - "tests/test_vrm_metadata.py"
      - "tests/test_vrm_assets.py"
      - "docs/VRM_AVATAR_FA.md"
      - "scripts/build_stage3_release.py"
      - "README.md"
      - ".github/workflows/vrm-avatar-checks.yml"
  pull_request:
    branches: [main]
    paths:
      - "kira/vrm/**"
      - "kira/face.py"
      - "kira/main.py"
      - "kira/characters/registry.py"
      - "kira/characters/kira.py"
      - "kira/vrm/paths.py"
      - "kira sample.vrm"
      - "tests/test_vrm_metadata.py"
      - "tests/test_vrm_assets.py"
      - "docs/VRM_AVATAR_FA.md"
      - "README.md"
      - ".github/workflows/vrm-avatar-checks.yml"

permissions:
  contents: write

jobs:
  metadata-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bundle the offline VRM viewer
        run: |
          npm install --prefix kira/vrm/web --no-audit --no-fund
          npm --prefix kira/vrm/web run build
      - name: Commit refreshed offline bundle
        if: github.event_name == 'push'
        run: |
          git add -f kira/vrm/web/package-lock.json kira/vrm/web/viewer.bundle.js
          if git diff --cached --quiet; then
            echo "VRM bundle is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build bundled offline VRM viewer [skip ci]"
          git push
      - name: Compile VRM integration
        run: python -m compileall -q kira/vrm kira/face.py kira/main.py kira/characters/registry.py kira/characters/kira.py scripts/build_stage3_release.py
      - name: Run VRM metadata and profile tests
        run: python -m unittest tests.test_vrm_metadata tests.test_vrm_assets
      - name: Package complete source ZIP
        if: github.event_name == 'push'
        id: package
        run: |
          python - <<'PY'
          from datetime import datetime
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          from zoneinfo import ZoneInfo
          import os

          excluded_dirs = {".git", ".venv", "venv", "__pycache__", ".pytest_cache", ".mypy_cache", ".ruff_cache", "node_modules", "logs", "dist"}
          excluded_names = {".env", "secrets.json", "api_keys.json", "settings.local.json", "user_settings.json"}
          excluded_suffixes = {".pyc", ".pyo", ".log", ".db", ".sqlite", ".sqlite3", ".key", ".pem", ".p12", ".pfx", ".zip", ".7z", ".rar"}
          stamp = datetime.now(ZoneInfo("Asia/Tehran")).strftime("%y%m%d_%H%M")
          name = f"ProjectKira_{stamp}.zip"
          output = Path("dist") / name
          output.parent.mkdir(parents=True, exist_ok=True)
          with ZipFile(output, "w", ZIP_DEFLATED, compresslevel=7) as archive:
              for path in Path(".").rglob("*"):
                  if not path.is_file():
                      continue
                  relative = path.relative_to(".")
                  if any(part in excluded_dirs for part in relative.parts):
                      continue
                  if path.name.lower() in excluded_names or path.suffix.lower() in excluded_suffixes:
                      continue
                  if path.name.lower().startswith(".env.") and path.name.lower() != ".env.example":
                      continue
                  archive.write(path, relative.as_posix())
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output_file:
              output_file.write(f"archive_name={name}\\n")
          print(f"Created {output} ({output.stat().st_size:,} bytes)")
          PY
      - name: Upload complete source ZIP
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.archive_name }}
          path: dist/${{ steps.package.outputs.archive_name }}
          if-no-files-found: error
          retention-days: 14
