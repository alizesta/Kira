name: VRM Avatar Backend Checks

on:
  push:
    branches: [feature/vrm-avatar-support]
    paths:
      - "kira/vrm/**"
      - "kira/face.py"
      - "kira/main.py"
      - "kira/characters/registry.py"
      - "tests/test_vrm_metadata.py"
      - ".github/workflows/vrm-avatar-checks.yml"
  pull_request:
    branches: [main]
    paths:
      - "kira/vrm/**"
      - "kira/face.py"
      - "kira/main.py"
      - "kira/characters/registry.py"
      - "tests/test_vrm_metadata.py"
      - ".github/workflows/vrm-avatar-checks.yml"

permissions:
  contents: write

jobs:
  metadata-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bundle the offline VRM viewer
        run: |
          npm install --prefix kira/vrm/web --no-audit --no-fund
          npm --prefix kira/vrm/web run build
      - name: Commit refreshed offline bundle
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- kira/vrm/web/package-lock.json kira/vrm/web/viewer.bundle.js; then
            echo "VRM bundle is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kira/vrm/web/package-lock.json kira/vrm/web/viewer.bundle.js
          git commit -m "Build bundled offline VRM viewer [skip ci]"
          git push
      - name: Compile VRM integration
        run: python -m compileall -q kira/vrm kira/face.py kira/main.py kira/characters/registry.py
      - name: Run VRM metadata and profile tests
        run: python -m unittest tests.test_vrm_metadata
