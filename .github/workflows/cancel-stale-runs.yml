name: Cancel stale Kira CI runs

on:
  push:
    branches:
      - fix/desktop-attachments-project-icons
    paths:
      - .github/workflows/cancel-stale-runs.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel-stale-runs:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel older runs on this branch
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace("refs/heads/", "");
            const keep = new Set([context.sha, context.payload.before].filter(Boolean));
            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch,
              per_page: 100,
            });
            for (const run of data.workflow_runs) {
              if (run.status !== "completed" && !keep.has(run.head_sha)) {
                core.info(`Cancelling stale run ${run.id} (${run.name}, ${run.head_sha})`);
                await github.rest.actions.cancelWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                });
              }
            }
