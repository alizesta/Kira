name: Build Stage 3 Neon Glass Release

on:
  push:
    branches: [main]
    paths:
      - "scripts/build_stage3_release.py"
      - "kira/mood.py"
      - "kira/emotion/runtime.py"
      - "kira/emotion/director.py"
      - "docs/EMOTIONAL_RUNTIME_FA.md"
      - "tests/test_emotional_runtime.py"
      - "emotion_library/emotions.json"
      - "emotion_library/rules.json"
      - "emotion_library/events.json"
      - "tests/test_mood.py"
      - "docs/EMOTIONAL_STATE_FA.md"
      - "kira/main.py"
      - "kira/theme.py"
      - "kira/ui_icons.py"
      - "kira/chat_render.py"
      - "tests/test_chat_render.py"
      - "kira/personality.py"
      - "kira/persona_memory.py"
      - "kira/characters/**"
      - "kira/strings.py"
      - "tests/test_character_profiles.py"
      - "tests/test_gui_offscreen.py"
      - "kira/config.py"
      - "kira/character/**"
      - "emotion_library/combinations.json"
      - "tests/test_config.py"
      - "tests/test_character_decision.py"
      - "tests/test_character_scenarios.py"
      - "tests/test_relationship_engine.py"
      - "tests/test_neon_emotion_glyphs.py"
      - "kira/character/relationship.py"
      - "docs/CHARACTER_DECISION_ENGINE_FA.md"
      - "scripts/build_stage3_release.py"
      - ".github/workflows/stage3-neon-glass-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage3-neon-glass-release
  cancel-in-progress: false

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GUI smoke-test dependencies
        run: python -m pip install -r requirements.txt

      - name: Test layered emotional state
        run: python -m unittest discover -s tests -p "test_chat_render.py" && python -m unittest discover -s tests -p "test_mood.py" && python -m unittest discover -s tests -p "test_emotional_runtime.py" && python -m unittest discover -s tests -p "test_character_decision.py" && python -m unittest discover -s tests -p "test_character_scenarios.py" && python -m unittest discover -s tests -p "test_relationship_engine.py" && python -m unittest discover -s tests -p "test_config.py" && python -m unittest discover -s tests -p "test_neon_emotion_glyphs.py" && python -m unittest discover -s tests -p "test_character_profiles.py" && python -m unittest discover -s tests -p "test_persona_memory.py" && QT_QPA_PLATFORM=offscreen python -m unittest discover -s tests -p "test_gui_offscreen.py"

      - name: Patch the uploaded Stage 3 archive and package it
        run: python scripts/build_stage3_release.py

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: stage3-neon-glass-2026-11-11
          name: Kira Stage 3 - Neon Glass UI
          body: |
            Stage 3 visual redesign focused on the desktop interface.

            - Neon cyan, violet and blue visual system
            - Translucent glass-style panels and refined surfaces
            - Consistent styling for chat, composer, route chip, settings, menus and controls
            - Spaced neon message action chips and individually coloured voice controls
            - Subtle animated cyan, violet and magenta glow around the main interface panels
            - Layered neon line icons with crisp luminous cores
            - Preserves the existing Stage 3 application logic and features
            - Keeps Windows 11 Acrylic/Mica window effects
            - Adds persistent layered emotions, including fear and disgust
            - Tracks conversational energy independently from the user's state
            - Adds separate behavioral dispositions with gradual decay and recovery
            - Preserves backward compatibility with existing mood data
            - Adds provider-independent emotion, behavior, energy, relationship and emotional-memory runtime
            - Adds persistent event history and gradual relationship-state changes
            - Adds provider-neutral personality/behaviour decisions and an opt-in initiative policy
            - Adds a live mood indicator with custom neon vector face glyphs for emotions; chat-message emoji remain unchanged
            - Adds an independent Character Library with Kira as the built-in starter profile
            - Separates app branding, shared AI/provider routing and character identity
            - Adds per-character profile notes, trait baselines, learned adjustments and emotional state
            - Adds Characters, Personality, Preferences and Help tabs; local model tuning is grouped under Routes
            - Keeps message actions icon-only
            - Adds query-relevant emotional memory recall and bounded personality adaptation from repeated explicit feedback
            - Adds a standalone bounded relationship engine for trust, closeness, familiarity, comfort and tension
            - Preserves mixed-emotion components and tests opt-in proactive follow-ups with quiet-hour/cooldown guards
          files: dist/ProjectKira_Stage3_Neon_Glass.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
