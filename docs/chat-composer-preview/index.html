<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kira — Chat UI review</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#202027;color:#eeeef5;font-family:Tahoma,"Segoe UI",sans-serif}body{min-height:100vh;background:radial-gradient(ellipse at 83% 4%,#1c345b 0,transparent 43%),#202027}.window{min-height:100vh;max-width:1440px;margin:auto;display:flex;flex-direction:column;padding:0 0 24px}.header{height:145px;flex:none;display:flex;align-items:flex-start;padding:66px 24px 0;gap:13px}.profile{color:#38d7ee;font-size:27px;margin:7px 12px}.bolt,.avatar{width:53px;height:54px;border-radius:15px;display:grid;place-items:center;font-size:32px;background:#20202a}.bolt{border:1.5px solid #e8c64d;color:#ffdc55}.avatar{border:1.5px solid #ee62c6;color:#ff79d9;background:#30243c;box-shadow:0 0 12px #ed65c655}.project{font-size:18px;margin:16px 0 0 0;color:#d9d9e5}.workspace{display:flex;flex:1;min-height:440px;position:relative}.sidebar{width:72px;flex:none;border-right:1px solid #ffffff08;display:flex;flex-direction:column;align-items:center;gap:30px;padding-top:7px;color:#b7b6c9}.sideitem{height:37px;width:40px;border-radius:10px;background:#ffffff0b;display:grid;place-items:center;font-size:20px}.history{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;padding:0 7.5% 0 5%;min-width:0;gap:14px}.messages{display:flex;flex-direction:column;gap:18px;max-height:55vh;overflow:auto;padding:8px 0 18px}.msg{max-width: min(82%,680px);padding:10px 14px;line-height:1.8;font-size:15px;white-space:pre-wrap}.msg.assistant{align-self:flex-start;background:#242434}.msg.user{align-self:flex-end;background:#39336d;min-width:60%;text-align:right}.composer-area{flex:none;display:flex;justify-content:center;padding:0 14px}.composer{width:620px;max-width:100%;background:rgba(27,27,45,.95);border:1px solid rgba(139,105,214,.45);border-radius:15px;padding:7px 9px 8px;box-shadow:0 8px 25px #0002}.expandline{height:25px;display:flex;justify-content:flex-end;direction:ltr}.btn{height:38px;min-width:36px;padding:0 7px;display:inline-flex;align-items:center;justify-content:center;border:0;background:transparent;color:#37d9ed;border-radius:9px;cursor:pointer;font-size:22px}.btn:hover{background:#383653}.btn.active{background:#39335d;outline:1px solid #62539b}.btn svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 4px #39d9ef66)}.send{width:46px;height:46px;border-radius:50%;background:linear-gradient(140deg,#9a83ef,#37c8e8);color:#fff}.send svg{filter:none;width:25px;height:25px}.editor{display:block;width:100%;height:85px;max-height:260px;resize:vertical;background:transparent;border:0;outline:0;color:#f0eff8;font:15px/1.9 Tahoma;padding:7px 9px;text-align:right;direction:rtl}.editor::placeholder{color:#85869a}.tools{display:flex;align-items:center;gap:2px;direction:rtl;min-height:43px}.tools .spacer{flex:1}.route{height:34px;border-radius:20px;border:1px solid #426078;background:#244154;color:#dff8ff;padding:0 11px;font-size:12px;white-space:nowrap;cursor:pointer}.popup{display:none;position:absolute;z-index:5;bottom:44px;right:0;min-width:210px;padding:7px;background:#29283c;border:1px solid #62528a;border-radius:10px;box-shadow:0 8px 24px #0008}.popup.show{display:block}.popup label,.popup button{display:block;width:100%;text-align:right;color:#eeeef5;background:transparent;border:0;padding:9px;border-radius:7px;font-size:13px}.popup label:hover,.popup button:hover{background:#403b5b}.popup input{accent-color:#9874df}.wrap{position:relative}.status{font-size:11px;color:#9696ad;padding:4px 5px 0;min-height:18px}.inspect{position:fixed;left:15px;bottom:15px;width:min(310px,calc(100vw - 30px));z-index:10;background:#191927f5;border:1px solid #594981;border-radius:12px;padding:12px;box-shadow:0 10px 30px #0008}.inspect h3{font-size:13px;margin:0}.inspect p{font-size:11px;line-height:1.6;color:#aaaabd}.inspect button{background:#39335e;color:white;border:1px solid #655294;padding:8px 11px;border-radius:8px}.inspect textarea{width:100%;height:65px;background:#222237;border:1px solid #514675;border-radius:7px;color:white;padding:8px;font:12px Tahoma}.chosen{outline:2px solid #ffca55!important;outline-offset:2px}.inspect .chosen-name{color:#f7d77d;font-size:12px;margin:8px 0}.file{display:none}
@media(max-width:650px){.header{height:95px;padding:25px 14px 0}.workspace{min-height:400px}.sidebar{width:42px}.history{padding:0 9px}.msg{max-width:94%;font-size:13px}.composer{padding:6px}.tools{gap:0}.btn{min-width:32px;padding:0 4px}.send{width:39px;height:39px}.route{font-size:10px;padding:0 6px}.inspect{left:8px;bottom:8px}}
</style></head><body><div class="window">
<header class="header"><div class="profile">♙</div><div class="bolt">ϟ</div><div class="avatar">☻</div><div class="project">Project Kira</div></header>
<main class="workspace"><aside class="sidebar"><div class="sideitem">···</div><div>···</div><div>···</div><div>···</div></aside><section class="history"><div class="messages" id="messages"><div class="msg assistant">سلام. این پیش‌نمایش بر اساس ساختار واقعی ChatComposer در Kira بازسازی شده است.</div><div class="msg user" id="last" hidden></div></div></section></main>
<section class="composer-area"><div class="composer" id="composer" data-part="سطح اصلی فیلد چت">
<div class="expandline"><button class="btn" id="expand" data-part="دکمه باز کردن فضای نوشتن" title="باز کردن فضای بزرگ‌تر"><svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/></svg></button></div>
<textarea class="editor" id="editor" data-part="ویرایشگر پیام" placeholder="پیامت رو بنویس..." rows="2"></textarea>
<div class="tools">
<div class="wrap"><button class="route" id="route" data-part="نشانگر مسیر و مدل">● Ready　⌃</button><div class="popup" id="routes"><button data-route="● Ready　⌃">● Ready</button><button data-route="☁ Cloud　⌃">☁ Cloud</button><button data-route="⚡ Auto　⌃">⚡ Auto</button></div></div>
<button class="btn" id="attach" data-part="دکمه پیوست" title="پیوست عکس یا فایل"><svg viewBox="0 0 24 24"><path d="m21.4 11.1-9.2 9.2a6 6 0 0 1-8.5-8.5l9.6-9.6a4 4 0 0 1 5.7 5.7l-9.6 9.6a2 2 0 0 1-2.8-2.8l8.8-8.8"/></svg></button><input class="file" id="file" type="file" multiple>
<div class="wrap"><button class="btn" id="search" data-part="دکمه جست‌وجو" title="جست‌وجو"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="7.3"/><path d="m16.2 16.2 5 5"/></svg></button><div class="popup" id="searchmenu"><label><input type="checkbox" checked> جست‌وجوی وب</label><label><input type="checkbox"> جست‌وجوی تصویری عکس ارسالی</label></div></div>
<span class="spacer"></span>
<button class="btn" id="eye" data-part="دکمه Eye Mode" title="Eye Mode"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
<button class="btn" id="mic" data-part="دکمه میکروفن" title="میکروفن"><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8"/></svg></button>
<button class="btn active" id="voice" data-part="دکمه پاسخ صوتی" title="پاسخ صوتی روشن"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15 9a5 5 0 0 1 0 6M18 6a9 9 0 0 1 0 12"/></svg></button>
<button class="btn send" id="send" data-part="دکمه ارسال پیام" title="ارسال پیام"><svg viewBox="0 0 24 24"><path d="m21 3-7.5 18-3.8-7.7L2 9.5 21 3Z"/><path d="M9.7 13.3 21 3"/></svg></button>
</div><div class="status" id="status">آماده · عملکردها در این پیش‌نمایش شبیه‌سازی می‌شوند</div></div></section></div>
<aside class="inspect"><div style="display:flex;justify-content:space-between;align-items:center"><h3>بازبینی اجزای فیلد چت</h3><button id="select">انتخاب بخش</button></div><p>حالت انتخاب را فعال کن و روی جزء موردنظر کلیک کن. توضیحت را وارد کن و گزارش را کپی کن.</p><div class="chosen-name" id="chosen">بخشی انتخاب نشده</div><textarea id="note" placeholder="تغییر موردنظرت..."></textarea><button id="copy" style="width:100%;margin-top:7px">کپی گزارش تغییرات</button></aside>
<script>
(()=>{const $=id=>document.getElementById(id);let selecting=false,current=null;const notes={};function menu(id){$(id).classList.toggle('show')}$('search').onclick=()=>menu('searchmenu');$('route').onclick=()=>menu('routes');document.addEventListener('click',e=>{if(!e.target.closest('.wrap'))document.querySelectorAll('.popup').forEach(x=>x.classList.remove('show'))});document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{$('route').textContent=b.dataset.route;$('routes').classList.remove('show')});$('attach').onclick=()=>$('file').click();$('file').onchange=()=>{$('status').textContent=[...$('file').files].map(x=>x.name).join('، ')||'آماده'};['eye','mic','voice'].forEach(id=>$(id).onclick=()=>{let v=$(id).classList.toggle('active');$('status').textContent=id==='mic'?(v?'میکروفون روشن · نمایشی':'میکروفون خاموش'):id==='eye'?(v?'Eye Mode روشن · نمایشی':'Eye Mode خاموش'):(v?'پاسخ صوتی روشن':'پاسخ صوتی خاموش')});$('expand').onclick=()=>{$('editor').style.height=$('editor').style.height==='220px'?'85px':'220px'};$('send').onclick=()=>{let v=$('editor').value.trim();if(!v)return;let el=document.createElement('div');el.className='msg user';el.textContent=v;$('messages').append(el);$('editor').value='';$('status').textContent='پیام در پیش‌نمایش ثبت شد؛ به Kira ارسال نشده است'};$('editor').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('send').click()}};$('select').onclick=()=>{selecting=!selecting;$('select').textContent=selecting?'پایان انتخاب':'انتخاب بخش'};document.querySelectorAll('[data-part]').forEach(el=>el.addEventListener('click',e=>{if(!selecting)return;e.stopPropagation();if(current)current.classList.remove('chosen');current=el;el.classList.add('chosen');$('chosen').textContent='بخش: '+el.dataset.part;$('note').value=notes[el.dataset.part]||''}));$('note').oninput=()=>{if(current)notes[current.dataset.part]=$('note').value};$('copy').onclick=async()=>{if(current)notes[current.dataset.part]=$('note').value;let s=Object.entries(notes).map(([k,v])=>k+' — '+v).join('\n');if(!s){$('status').textContent='ابتدا یک بخش را انتخاب کن';return}try{await navigator.clipboard.writeText(s);$('status').textContent='گزارش کپی شد'}catch(e){$('status').textContent=s}}})();
</script></body></html>
