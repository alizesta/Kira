<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Ai1 VRM Avatar</title>
  <style>
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:transparent; }
    body { font-family: "Segoe UI", sans-serif; user-select:none; }
    #stage { position:absolute; inset:0; overflow:hidden; background:transparent; }
    canvas { width:100%; height:100%; display:block; touch-action:none; outline:none; }
    #status { position:absolute; left:8px; right:8px; bottom:8px; display:none; color:#ffd3e9;
      background:rgba(16,18,35,.88); border:1px solid rgba(255,120,190,.55); border-radius:8px;
      padding:7px 9px; font:12px/1.5 "Segoe UI",sans-serif; white-space:pre-wrap; direction:rtl; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.5/lib/three-vrm.module.min.js"
    }
  }
  </script>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
</head>
<body>
  <div id="stage"></div>
  <div id="status"></div>
  <script type="module" src="/viewer.js"></script>
</body>
</html>
