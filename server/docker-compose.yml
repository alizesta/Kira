services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kira_core}
      POSTGRES_USER: ${POSTGRES_USER:-kira}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in server/.env}
    volumes:
      - kira_core_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kira} -d ${POSTGRES_DB:-kira_core}"]
      interval: 10s
      timeout: 5s
      retries: 10

  core:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      KIRA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kira}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kira_core}
      KIRA_ENV: production
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  kira_core_db:
